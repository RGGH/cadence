[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
description = "Terminal dashboard for BLE cycling speed/cadence sensors (Saris etc.)"

[dependencies]
anyhow = "1"
btleplug = "0.11"
futures = "0.3"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = "1"
